<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blox Fruits Live Checker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        :root {
            --bg: #050810;
            --panel: rgba(13, 19, 33, .88);
            --panel2: rgba(20, 28, 46, .9);

            --blue: #38bdf8;
            --cyan: #22d3ee;
            --purple: #8b5cf6;

            --text: #f8fafc;
            --muted: #94a3b8;

            --green: #4ade80;
            --red: #f87171;

            --border: rgba(148,163,184,.1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            padding: 35px 20px;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(14,165,233,.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(139,92,246,.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(34,211,238,.08),
                    transparent 35%
                ),
                var(--bg);

            overflow-x: hidden;
        }


        /* ================================
           BACKGROUND LIGHT
        ================================= */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            filter: blur(120px);

            opacity: .12;

            pointer-events: none;

            z-index: -1;
        }

        body::before {
            background: #0ea5e9;
            top: -150px;
            left: -120px;
        }

        body::after {
            background: #8b5cf6;
            right: -150px;
            bottom: -150px;
        }


        /* ================================
           HEADER
        ================================= */

        .header {
            max-width: 1450px;

            margin: auto;
            margin-bottom: 28px;

            text-align: center;
        }

        .live {
            display: inline-flex;

            align-items: center;
            gap: 8px;

            padding: 7px 14px;

            margin-bottom: 14px;

            border-radius: 50px;

            background: rgba(74,222,128,.06);

            border: 1px solid rgba(74,222,128,.15);

            color: #86efac;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: .7px;
        }

        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #4ade80;

            box-shadow:
                0 0 8px #4ade80,
                0 0 18px #4ade80;

            animation: livePulse 1.6s infinite;
        }

        @keyframes livePulse {
            0%,100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .45;
                transform: scale(.7);
            }
        }

        h1 {
            font-size: clamp(25px, 4vw, 43px);

            font-weight: 900;

            letter-spacing: 2px;

            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #38bdf8,
                    #8b5cf6,
                    #22d3ee,
                    #fff
                );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation: gradientMove 6s linear infinite;
        }

        @keyframes gradientMove {
            from {
                background-position: 0%;
            }

            to {
                background-position: 300%;
            }
        }

        .subtitle {
            margin-top: 8px;

            color: #64748b;

            font-size: 13px;
        }


        /* ================================
           MAIN CARD
        ================================= */

        .table-container {
            max-width: 1450px;

            margin: auto;

            padding: 8px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,24,39,.94),
                    rgba(8,13,24,.94)
                );

            border: 1px solid var(--border);

            box-shadow:
                0 30px 80px rgba(0,0,0,.5),
                inset 0 1px rgba(255,255,255,.025);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            overflow-x: auto;

            animation: cardIn .5s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* ================================
           TABLE
        ================================= */

        table {
            width: 100%;

            min-width: 1500px;

            border-collapse: separate;

            border-spacing: 0;

            text-align: left;
        }

        th {
            padding: 16px 18px;

            color: #64748b;

            background: rgba(30,41,59,.7);

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

            white-space: nowrap;
        }

        th:first-child {
            border-radius: 11px 0 0 11px;
        }

        th:last-child {
            border-radius: 0 11px 11px 0;
        }

        td {
            padding: 16px 18px;

            color: #cbd5e1;

            font-size: 13px;

            white-space: nowrap;

            border-bottom:
                1px solid
                rgba(148,163,184,.065);
        }

        tbody tr {
            transition:
                background .2s ease,
                transform .2s ease;
        }

        tbody tr:hover {
            background:
                linear-gradient(
                    90deg,
                    rgba(56,189,248,.045),
                    rgba(139,92,246,.025)
                );
        }

        tbody tr:last-child td {
            border-bottom: none;
        }


        /* ================================
           USERNAME
        ================================= */

        .username {
            display: flex;

            align-items: center;

            gap: 9px;

            color: #f8fafc;

            font-weight: 700;
        }

        .user-dot {
            width: 7px;
            height: 7px;

            flex-shrink: 0;

            border-radius: 50%;

            background: var(--blue);

            box-shadow:
                0 0 8px rgba(56,189,248,.9);
        }


        /* ================================
           NORMAL VALUES
        ================================= */

        .level {
            color: #facc15;

            font-weight: 800;
        }

        .money {
            color: #4ade80;

            font-weight: 700;
        }

        .fragment {
            color: #c084fc;

            font-weight: 700;
        }


        /* ================================
           RACE
        ================================= */

        .race {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 6px 10px;

            border-radius: 8px;

            background:
                rgba(139,92,246,.08);

            border:
                1px solid
                rgba(139,92,246,.15);

            color: #c4b5fd;

            font-size: 12px;

            font-weight: 700;
        }

        .race-version {
            color: #67e8f9;

            font-size: 10px;
        }


        /* ================================
           EQUIPMENT
        ================================= */

        .equipment {
            display: inline-flex;

            align-items: center;

            max-width: 170px;

            padding: 7px 10px;

            border-radius: 8px;

            background:
                rgba(56,189,248,.045);

            border:
                1px solid
                rgba(56,189,248,.1);

            color: #bae6fd;

            font-size: 12px;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* ================================
           BADGES
        ================================= */

        .yes,
        .no {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 800;
        }

        .yes {
            color: #86efac;

            background:
                rgba(74,222,128,.07);

            border:
                1px solid
                rgba(74,222,128,.14);

            box-shadow:
                0 0 12px
                rgba(74,222,128,.03);
        }

        .no {
            color: #64748b;

            background:
                rgba(100,116,139,.06);

            border:
                1px solid
                rgba(100,116,139,.08);
        }


        /* ================================
           DROPDOWN
        ================================= */

        .dropdown-cell {
            position: relative;

            display: inline-block;
        }

        .dropdown-btn {
            min-width: 135px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding: 8px 11px;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    rgba(56,189,248,.08),
                    rgba(139,92,246,.07)
                );

            border:
                1px solid
                rgba(56,189,248,.13);

            color: #7dd3fc;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s ease;
        }

        .dropdown-arrow {
            font-size: 8px;

            transition:
                transform .2s ease;
        }

        .dropdown-cell:hover .dropdown-btn {
            background:
                linear-gradient(
                    135deg,
                    rgba(56,189,248,.15),
                    rgba(139,92,246,.13)
                );

            border-color:
                rgba(56,189,248,.3);

            box-shadow:
                0 0 20px
                rgba(56,189,248,.07);
        }

        .dropdown-cell:hover
        .dropdown-arrow {
            transform: rotate(180deg);
        }


        /* ================================
           DROPDOWN MENU
        ================================= */

        .dropdown-menu {
            position: absolute;

            left: 0;

            top: calc(100% + 7px);

            z-index: 99999;

            min-width: 210px;

            max-width: 280px;

            max-height: 260px;

            overflow-y: auto;

            padding: 7px;

            border-radius: 12px;

            background:
                rgba(8,14,27,.98);

            border:
                1px solid
                rgba(56,189,248,.18);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.75),
                0 0 30px
                rgba(56,189,248,.05);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transform:
                translateY(-7px)
                scale(.98);

            transform-origin: top left;

            transition:
                opacity .18s ease,
                transform .18s ease,
                visibility .18s ease;
        }

        /*
            Vùng nối giúp rê chuột từ button
            xuống menu không bị đóng
        */

        .dropdown-menu::before {
            content: "";

            position: absolute;

            top: -12px;

            left: 0;

            width: 100%;

            height: 12px;
        }

        .dropdown-cell:hover
        .dropdown-menu {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transform:
                translateY(0)
                scale(1);
        }


        /* ================================
           DROPDOWN ITEM
        ================================= */

        .dropdown-item {
            padding: 9px 10px;

            color: #cbd5e1;

            font-size: 12px;

            border-radius: 7px;

            border-bottom:
                1px solid
                rgba(148,163,184,.05);

            transition: .18s ease;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            color: #7dd3fc;

            background:
                rgba(56,189,248,.08);

            padding-left: 14px;
        }


        /* ================================
           SCROLLBAR
        ================================= */

        .table-container::-webkit-scrollbar {
            height: 7px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #080d17;

            border-radius: 20px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background:
                linear-gradient(
                    90deg,
                    #0ea5e9,
                    #8b5cf6
                );

            border-radius: 20px;
        }

        .dropdown-menu::-webkit-scrollbar {
            width: 5px;
        }

        .dropdown-menu::-webkit-scrollbar-track {
            background: transparent;
        }

        .dropdown-menu::-webkit-scrollbar-thumb {
            background: #334155;

            border-radius: 20px;
        }


        /* ================================
           EMPTY
        ================================= */

        .empty {
            text-align: center;

            padding: 40px !important;

            color: #64748b !important;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            body {
                padding: 22px 10px;
            }

            h1 {
                font-size: 23px;

                letter-spacing: 1px;
            }

            .subtitle {
                font-size: 11px;
            }

            .table-container {
                border-radius: 14px;
            }

            table {
                min-width: 1500px;
            }

            th,
            td {
                padding:
                    13px 14px;
            }
        }

    </style>
</head>


<body>

    <!-- HEADER -->

    <div class="header">

        <div class="live">

            <span class="live-dot"></span>

            LIVE DATABASE

        </div>

        <h1>
            ⚡ BLOX FRUITS ACCOUNT CHECKER ⚡
        </h1>

        <p class="subtitle">
            Real-time account information • Auto refresh every 5 seconds
        </p>

    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>👤 Tên</th>

                    <th>⭐ Level</th>

                    <th>💰 Beli</th>

                    <th>💎 Fragment</th>

                    <th>🧬 Tộc</th>

                    <th>👊 Melee</th>

                    <th>🍎 Fruit</th>

                    <th>⚔️ Sword</th>

                    <th>🔫 Gun</th>

                    <th>🍏 Fruit Đồ</th>

                    <th>🎨 Haki Màu</th>

                    <th>🪖 Valkyrie</th>

                    <th>🪞 Mirror</th>

                </tr>

            </thead>


            <tbody id="accTableBody">

                <tr>

                    <td
                        colspan="13"
                        class="empty"
                    >

                        ⟳ Đang tải dữ liệu từ Firebase...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <script>

        /* ==========================================
           FIREBASE

           LƯU Ý:
           Database của bạn có node "accounts"
        ========================================== */

        const FIREBASE_REST_URL =
            "https://blox-tracker-default-rtdb.firebaseio.com";

        const ACCOUNTS_URL =
            FIREBASE_REST_URL + "/accounts";


        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================================
           FORMAT NUMBER

           125000000
           →
           125,000,000
        ========================================== */

        function formatNumber(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "0";
            }

            const number =
                Number(
                    String(value)
                        .replace(/,/g, "")
                        .replace(/[^\d.-]/g, "")
                );

            if (Number.isNaN(number)) {
                return escapeHTML(value);
            }

            return number.toLocaleString("en-US");

        }


        /* ==========================================
           GET VALUE
           Cho phép một số tên field phổ biến
        ========================================== */

        function getValue(
            acc,
            names,
            fallback = ""
        ) {

            for (const name of names) {

                if (
                    acc[name] !== undefined &&
                    acc[name] !== null &&
                    acc[name] !== ""
                ) {
                    return acc[name];
                }

            }

            return fallback;

        }


        /* ==========================================
           ARRAY HELPER
        ========================================== */

        function getArray(
            acc,
            names
        ) {

            for (const name of names) {

                const value = acc[name];

                if (Array.isArray(value)) {
                    return value;
                }

                /*
                    Một số script có thể lưu
                    danh sách dưới dạng object:
                    {
                        "0": "Kitsune",
                        "1": "Dragon"
                    }
                */

                if (
                    value &&
                    typeof value === "object"
                ) {

                    return Object.values(value);

                }

            }

            return [];

        }


        /* ==========================================
           DROPDOWN
        ========================================== */

        function createDropdown(
            icon,
            title,
            array
        ) {

            if (
                !array ||
                array.length === 0
            ) {

                return `
                    <span
                        style="
                            color:#64748b;
                            font-size:12px;
                        "
                    >
                        Không có
                    </span>
                `;

            }


            const items =
                array
                    .map(item => {

                        return `
                            <div class="dropdown-item">
                                ${icon}
                                ${escapeHTML(item)}
                            </div>
                        `;

                    })
                    .join("");


            return `

                <div class="dropdown-cell">

                    <div class="dropdown-btn">

                        <span>
                            ${icon}
                            ${title}
                            (${array.length})
                        </span>

                        <span class="dropdown-arrow">
                            ▼
                        </span>

                    </div>

                    <div class="dropdown-menu">

                        ${items}

                    </div>

                </div>

            `;

        }


        /* ==========================================
           YES / NO BADGE
        ========================================== */

        function createBadge(value) {

            const text =
                String(value ?? "")
                    .toLowerCase();


            const yes =
                value === true ||
                value === "✔ Có" ||
                value === "Có" ||
                value === "Yes" ||
                value === "true" ||
                text === "yes";


            if (yes) {

                return `
                    <span class="yes">
                        ✔ Có
                    </span>
                `;

            }


            return `
                <span class="no">
                    ✖ Không
                </span>
            `;

        }


        /* ==========================================
           FETCH ACCOUNTS
        ========================================== */

        async function fetchAccounts() {

            const tbody =
                document.getElementById(
                    "accTableBody"
                );


            try {

                const response =
                    await fetch(
                        ACCOUNTS_URL + ".json"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Firebase HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                tbody.innerHTML = "";


                if (
                    !data ||
                    Object.keys(data).length === 0
                ) {

                    tbody.innerHTML = `

                        <tr>

                            <td
                                colspan="13"
                                class="empty"
                            >

                                📭 Chưa có tài khoản
                                nào được cập nhật.

                            </td>

                        </tr>

                    `;

                    return;

                }


                /* ==================================
                   LOOP ACCOUNT
                ================================== */

                for (
                    const accountKey in data
                ) {

                    const acc =
                        data[accountKey] || {};


                    /* ==============================
                       USERNAME
                    ============================== */

                    const username =
                        getValue(
                            acc,
                            [
                                "username",
                                "user",
                                "name",
                                "Username",
                                "Name"
                            ],
                            accountKey
                        );


                    /* ==============================
                       LEVEL
                    ============================== */

                    const level =
                        getValue(
                            acc,
                            [
                                "level",
                                "Level",
                                "lv",
                                "Lv"
                            ],
                            0
                        );


                    /* ==============================
                       BELI
                    ============================== */

                    const beli =
                        getValue(
                            acc,
                            [
                                "beli",
                                "Beli",
                                "money",
                                "Money"
                            ],
                            0
                        );


                    /* ==============================
                       FRAGMENTS
                    ============================== */

                    const fragments =
                        getValue(
                            acc,
                            [
                                "fragments",
                                "Fragments",
                                "fragment",
                                "Fragment"
                            ],
                            0
                        );


                    /* ==============================
                       RACE
                    ============================== */

                    const race =
                        getValue(
                            acc,
                            [
                                "race",
                                "Race",
                                "races"
                            ],
                            "Unknown"
                        );


                    const raceVersion =
                        getValue(
                            acc,
                            [
                                "raceVersion",
                                "RaceVersion",
                                "raceStage",
                                "RaceStage",
                                "raceV",
                                "RaceV",
                                "vRace"
                            ],
                            ""
                        );


                    let raceHTML = `

                        <span class="race">

                            🧬
                            ${escapeHTML(race)}

                            ${
                                raceVersion
                                ? `
                                    <span
                                        class="race-version"
                                    >
                                        ${escapeHTML(
                                            raceVersion
                                        )}
                                    </span>
                                  `
                                : ""
                            }

                        </span>

                    `;


                    /* ==============================
                       MELEE
                    ============================== */

                    const melee =
                        getValue(
                            acc,
                            [
                                "melee",
                                "Melee",
                                "fightingStyle",
                                "FightingStyle"
                            ],
                            "Không có"
                        );


                    /* ==============================
                       CURRENT FRUIT
                    ============================== */

                    const currentFruit =
                        getValue(
                            acc,
                            [
                                "fruit",
                                "Fruit",
                                "currentFruit",
                                "CurrentFruit",
                                "devilFruit",
                                "DevilFruit"
                            ],
                            "Không có"
                        );


                    /* ==============================
                       SWORD
                    ============================== */

                    const sword =
                        getValue(
                            acc,
                            [
                                "sword",
                                "Sword",
                                "currentSword",
                                "CurrentSword"
                            ],
                            "Không có"
                        );


                    /* ==============================
                       GUN
                    ============================== */

                    const gun =
                        getValue(
                            acc,
                            [
                                "gun",
                                "Gun",
                                "currentGun",
                                "CurrentGun"
                            ],
                            "Không có"
                        );


                    /* ==============================
                       FRUIT INVENTORY
                    ================================= */

                    const fruits =
                        getArray(
                            acc,
                            [
                                "fruits",
                                "Fruits",
                                "fruitInventory",
                                "FruitInventory",
                                "inventoryFruits",
                                "InventoryFruits"
                            ]
                        );


                    const fruitHTML =
                        createDropdown(
                            "🍎",
                            "Fruit",
                            fruits
                        );


                    /* ==============================
                       HAKI COLORS
                    ================================= */

                    const hakiColors =
                        getArray(
                            acc,
                            [
                                "hakiColors",
                                "HakiColors",
                                "haki",
                                "Haki",
                                "colors",
                                "Colors"
                            ]
                        );


                    const hakiHTML =
                        createDropdown(
                            "🎨",
                            "Haki",
                            hakiColors
                        );


                    /* ==============================
                       VALKYRIE
                    ================================= */

                    const valkyrie =
                        getValue(
                            acc,
                            [
                                "valkyrie",
                                "Valkyrie",
                                "valk",
                                "Valk"
                            ],
                            false
                        );


                    /* ==============================
                       MIRROR
                    ================================= */

                    const mirror =
                        getValue(
                            acc,
                            [
                                "mirror",
                                "Mirror"
                            ],
                            false
                        );


                    /* ==============================
                       CREATE ROW
                    ================================= */

                    const row = `

                        <tr>

                            <!-- NAME -->

                            <td>

                                <div class="username">

                                    <span
                                        class="user-dot"
                                    ></span>

                                    ${escapeHTML(
                                        username
                                    )}

                                </div>

                            </td>


                            <!-- LEVEL -->

                            <td>

                                <span
                                    class="level"
                                >
                                    ⭐
                                    ${formatNumber(
                                        level
                                    )}
                                </span>

                            </td>


                            <!-- BELI -->

                            <td>

                                <span
                                    class="money"
                                >
                                    $${formatNumber(
                                        beli
                                    )}
                                </span>

                            </td>


                            <!-- FRAGMENT -->

                            <td>

                                <span
                                    class="fragment"
                                >
                                    💎
                                    ${formatNumber(
                                        fragments
                                    )}
                                </span>

                            </td>


                            <!-- RACE -->

                            <td>
                                ${raceHTML}
                            </td>


                            <!-- MELEE -->

                            <td>

                                <span
                                    class="equipment"
                                    title="${escapeHTML(
                                        melee
                                    )}"
                                >
                                    👊
                                    ${escapeHTML(
                                        melee
                                    )}
                                </span>

                            </td>


                            <!-- FRUIT -->

                            <td>

                                <span
                                    class="equipment"
                                    title="${escapeHTML(
                                        currentFruit
                                    )}"
                                >
                                    🍎
                                    ${escapeHTML(
                                        currentFruit
                                    )}
                                </span>

                            </td>


                            <!-- SWORD -->

                            <td>

                                <span
                                    class="equipment"
                                    title="${escapeHTML(
                                        sword
                                    )}"
                                >
                                    ⚔️
                                    ${escapeHTML(
                                        sword
                                    )}
                                </span>

                            </td>


                            <!-- GUN -->

                            <td>

                                <span
                                    class="equipment"
                                    title="${escapeHTML(
                                        gun
                                    )}"
                                >
                                    🔫
                                    ${escapeHTML(
                                        gun
                                    )}
                                </span>

                            </td>


                            <!-- FRUIT INVENTORY -->

                            <td>

                                ${fruitHTML}

                            </td>


                            <!-- HAKI -->

                            <td>

                                ${hakiHTML}

                            </td>


                            <!-- VALKYRIE -->

                            <td>

                                ${createBadge(
                                    valkyrie
                                )}

                            </td>


                            <!-- MIRROR -->

                            <td>

                                ${createBadge(
                                    mirror
                                )}

                            </td>

                        </tr>

                    `;


                    tbody.insertAdjacentHTML(
                        "beforeend",
                        row
                    );

                }

            }

            catch (error) {

                console.error(
                    "Firebase Error:",
                    error
                );


                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="13"
                            class="empty"
                        >

                            ⚠️ Không thể tải dữ liệu

                            <br>

                            <small
                                style="
                                    color:#475569;
                                    display:block;
                                    margin-top:7px;
                                "
                            >
                                Đang thử kết nối lại
                                với Firebase...
                            </small>

                        </td>

                    </tr>

                `;

            }

        }


        /* ==========================================
           LOAD
        ========================================== */

        fetchAccounts();


        /* ==========================================
           AUTO REFRESH
        ========================================== */

        setInterval(
            fetchAccounts,
            5000
        );

    </script>

</body>
    </html>
