<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Blox Fruits Live Account Checker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; padding: 40px; }

        h2 { text-align: center; margin-bottom: 30px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(56,189,248,0.4); }

        .table-container { background: #111827; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid #1f2937; overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 18px; border-bottom: 1px solid #1f2937; }
        th { background: #1f2937; color: #9ca3af; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }

        tr:hover { background: #1a2234; transition: 0.2s ease; }

        .badge-yes { color: #4ade80; font-weight: bold; }
        .badge-no { color: #f87171; opacity: 0.5; }

        /* HIỆU ỨNG DROPDOWN HOVER ĐÈ LÊN BẢNG */
        .dropdown-cell { position: relative; display: inline-block; cursor: pointer; }
        .dropdown-btn { background: #1f2937; padding: 6px 12px; border-radius: 6px; border: 1px solid #374151; font-size: 13px; color: #38bdf8; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .dropdown-btn:hover { background: #374151; color: #bae6fd; }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 999; /* Ép nổi đè lên các hàng bên dưới */
            min-width: 170px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            padding: 8px;
            margin-top: 5px;
        }

        .dropdown-cell:hover .dropdown-menu { display: block; animation: dropdownFade 0.2s ease-in-out; }

        .dropdown-item { padding: 6px 10px; font-size: 13px; color: #d1d5db; border-bottom: 1px solid #1f2937; }
        .dropdown-item:last-child { border-bottom: none; }

        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h2>⚡ Live Account Checker - Blox Fruits ⚡</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Tên Tài Khoản</th>
                    <th>Mũ Valkyrie</th>
                    <th>Mảnh Gương</th>
                    <th>Haki Màu (Skin)</th>
                    <th>Trái Ác Quỷ</th>
                </tr>
            </thead>
            <tbody id="accTableBody">
                <tr><td colspan="5" style="text-align: center; color: #9ca3af;">Đang tải dữ liệu từ Firebase...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Link Firebase Realtime Database của bạn (Nhớ bỏ dấu / ở cuối)
        const FIREBASE_REST_URL = "https://blox-tracker-default-rtdb.firebaseio.com";

        async function fetchAccounts() {
            try {
                let response = await fetch(FIREBASE_REST_URL);
                let data = await response.json();
                
                let tbody = document.getElementById("accTableBody");
                tbody.innerHTML = "";

                if (!data) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f87171;">Chưa có tài khoản nào được cập nhật!</td></tr>`;
                    return;
                }

                for (let username in data) {
                    let acc = data[username];

                    // Xử lý danh sách Haki Màu
                    let hakiHTML = `<span style="color:#9ca3af;">Không có</span>`;
                    if (acc.hakiColors && acc.hakiColors.length > 0) {
                        let items = acc.hakiColors.map(c => `<div class="dropdown-item">🎨 ${c}</div>`).join("");
                        hakiHTML = `
                            <div class="dropdown-cell">
                                <div class="dropdown-btn">Haki Màu (${acc.hakiColors.length}) <span>▼</span></div>
                                <div class="dropdown-menu">${items}</div>
                            </div>`;
                    }

                    // Xử lý danh sách Trái Ác Quỷ
                    let fruitHTML = `<span style="color:#9ca3af;">Không có</span>`;
                    if (acc.fruits && acc.fruits.length > 0) {
                        let items = acc.fruits.map(f => `<div class="dropdown-item">🍎 ${f}</div>`).join("");
                        fruitHTML = `
                            <div class="dropdown-cell">
                                <div class="dropdown-btn">Trái (${acc.fruits.length}) <span>▼</span></div>
                                <div class="dropdown-menu">${items}</div>
                            </div>`;
                    }

                    let valkBadge = acc.valkyrie === "✔ Có" ? `<span class="badge-yes">✔ Có</span>` : `<span class="badge-no">✖ Không</span>`;
                    let mirrorBadge = acc.mirror === "✔ Có" ? `<span class="badge-yes">✔ Có</span>` : `<span class="badge-no">✖ Không</span>`;

                    let row = `
                        <tr>
                            <td><b>${username}</b></td>
                            <td>${valkBadge}</td>
                            <td>${mirrorBadge}</td>
                            <td>${hakiHTML}</td>
                            <td>${fruitHTML}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                }
            } catch (error) {
                console.error("Lỗi khi kết nối Firebase:", error);
            }
        }

        // Tự động load và cập nhật dữ liệu mỗi 5 giây
        fetchAccounts();
        setInterval(fetchAccounts, 5000);
    </script>
</body>
</html>
