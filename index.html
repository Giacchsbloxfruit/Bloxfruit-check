<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Blox Fruits Account Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-blue-400 border-b border-slate-700 pb-3">BẢNG QUẢN LÝ TÀI KHOẢN BLOX FRUITS</h1>
        <div class="overflow-x-auto bg-slate-800 rounded-lg shadow-lg">
            <table class="w-full text-sm text-left text-gray-300">
                <thead class="text-xs uppercase bg-slate-700 text-gray-200">
                    <tr>
                        <th class="p-3">Username</th>
                        <th class="p-3">Trạng thái</th>
                        <th class="p-3">Level</th>
                        <th class="p-3">Trái Đang Dùng</th>
                        <th class="p-3">Melee</th>
                        <th class="p-3">Kiếm</th>
                        <th class="p-3">Súng</th>
                        <th class="p-3">Tộc</th>
                        <th class="p-3">Trái Đỏ (Inven)</th>
                    </tr>
                </thead>
                <tbody id="accountTable">
                    <tr><td colspan="9" class="p-4 text-center text-gray-400">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // CẤU HÌNH: Dán URL Firebase của bạn vào đây
        const FIREBASE_URL = "https://console.firebase.google.com/project/blox-tracker/database/blox-tracker-default-rtdb/data/~2F?hl=vi-VN";

        async function fetchAccounts() {
            try {
                const res = await fetch(`${FIREBASE_URL}/accounts.json`);
                const data = await res.json();
                const tableBody = document.getElementById("accountTable");
                tableBody.innerHTML = "";

                if (!data) {
                    tableBody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">Chưa có acc nào gửi dữ liệu.</td></tr>`;
                    return;
                }

                const currentTime = Math.floor(Date.now() / 1000);

                Object.keys(data).forEach(key => {
                    const acc = data[key];
                    // Nếu quá 60 giây không gửi dữ liệu thì coi như Offline
                    const isOnline = (currentTime - acc.last_seen) < 60; 
                    
                    const statusBadge = isOnline 
                        ? `<span class="bg-green-500/20 text-green-400 px-2.5 py-1 rounded-full text-xs font-bold border border-green-500/30">ONLINE</span>`
                        : `<span class="bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full text-xs font-bold border border-red-500/30">OFFLINE</span>`;

                    const row = `
                        <tr class="border-b border-slate-700 hover:bg-slate-750 transition">
                            <td class="p-3 font-semibold text-white">${acc.username}</td>
                            <td class="p-3">${statusBadge}</td>
                            <td class="p-3 text-yellow-400 font-bold">${acc.level}</td>
                            <td class="p-3 text-purple-300">${acc.fruit || 'None'}</td>
                            <td class="p-3">${acc.melee || 'None'}</td>
                            <td class="p-3">${acc.sword || 'None'}</td>
                            <td class="p-3">${acc.gun || 'None'}</td>
                            <td class="p-3 text-cyan-300">${acc.race || 'Unknown'}</td>
                            <td class="p-3 text-red-400 font-semibold">${acc.red_fruits || 'Không có'}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (err) {
                console.error("Lỗi:", err);
            }
        }

        fetchAccounts();
        setInterval(fetchAccounts, 5000); // Tự động load lại web mỗi 5 giây
    </script>
</body>
</html>
