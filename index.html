<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blox Fruits Account Checker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

:root {
    --bg: #080b11;
    --panel: #0d121a;
    --panel2: #111720;
    --line: #202833;

    --text: #e5e7eb;
    --muted: #7f8997;

    --blue: #4aa3df;
    --green: #36d37c;
    --red: #ef5f67;

    --yellow: #e7c75d;
    --purple: #a77bdb;
}

/* =========================
   BODY
========================= */

body {
    min-height: 100vh;
    padding: 25px 18px 70px;

    background: var(--bg);
    color: var(--text);

    overflow-x: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    max-width: 1500px;
    margin: 0 auto 18px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.title-wrap h1 {
    font-size: 23px;
    font-weight: 750;
    color: #f4f4f5;
    letter-spacing: .3px;
}

.title-wrap p {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
}

.live-indicator {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 6px 10px;

    border: 1px solid #26303c;
    background: #0c1118;

    border-radius: 6px;

    color: #aeb7c3;

    font-size: 10px;
    font-weight: 700;

    white-space: nowrap;
}

.live-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--green);
}

/* =========================
   TABLE CARD
========================= */

.table-container {
    width: 100%;
    max-width: 1500px;

    margin: auto;

    background: var(--panel);

    border: 1px solid var(--line);
    border-radius: 8px;

    overflow-x: auto;
    overflow-y: visible;
}

/* =========================
   TABLE
========================= */

table {
    width: 100%;
    min-width: 1250px;

    table-layout: fixed;

    border-collapse: collapse;
}

/*
    Để 13 cột gọn trên 1 dòng
*/

th:nth-child(1)  { width: 11%; }
th:nth-child(2)  { width: 5%; }
th:nth-child(3)  { width: 7%; }
th:nth-child(4)  { width: 7%; }
th:nth-child(5)  { width: 8%; }
th:nth-child(6)  { width: 8%; }
th:nth-child(7)  { width: 7%; }
th:nth-child(8)  { width: 8%; }
th:nth-child(9)  { width: 7%; }
th:nth-child(10) { width: 9%; }
th:nth-child(11) { width: 9%; }
th:nth-child(12) { width: 7%; }
th:nth-child(13) { width: 7%; }

th {
    height: 38px;

    padding: 0 9px;

    background: var(--panel2);

    border-bottom: 1px solid var(--line);

    color: #687384;

    text-align: left;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: .7px;
    text-transform: uppercase;

    white-space: nowrap;
}

td {
    height: 47px;

    padding: 0 9px;

    border-bottom: 1px solid #1a212b;

    color: #cbd5df;

    font-size: 11px;

    vertical-align: middle;

    overflow: visible;
}

tbody tr {
    background: transparent;
    transition: background .15s ease;
}

tbody tr:hover {
    background: #111821;
}

tbody tr:last-child td {
    border-bottom: 0;
}

/* =========================
   USERNAME
========================= */

.username-wrap {
    min-width: 0;

    display: flex;
    align-items: center;

    gap: 6px;
}

.status-dot {
    width: 7px;
    height: 7px;

    flex: 0 0 7px;

    border-radius: 50%;
}

.status-online {
    background: var(--green);
    box-shadow: 0 0 7px rgba(54,211,124,.45);
}

.status-offline {
    background: var(--red);
}

.username {
    min-width: 0;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    color: #f0f2f5;

    font-weight: 650;
}

/* =========================
   NORMAL VALUES
========================= */

.level {
    color: var(--yellow);
    font-weight: 700;
}

.beli {
    color: #68d391;
    font-weight: 650;
}

.fragment {
    color: var(--purple);
    font-weight: 650;
}

/* =========================
   RACE
========================= */

.race {
    display: inline-flex;
    align-items: center;
    gap: 4px;

    max-width: 100%;

    padding: 4px 7px;

    border: 1px solid #293241;
    background: #111820;

    border-radius: 5px;

    color: #c7b6e4;

    font-size: 10px;
    font-weight: 650;

    white-space: nowrap;
}

.race-version {
    color: #7caed3;
    font-size: 9px;
}

/* =========================
   EQUIPMENT
========================= */

.equipment {
    display: block;

    width: 100%;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    color: #bcc6d2;

    font-size: 10px;
}

/* =========================
   BADGE
========================= */

.badge {
    display: inline-flex;
    align-items: center;

    padding: 3px 6px;

    border-radius: 4px;

    font-size: 9px;
    font-weight: 700;

    white-space: nowrap;
}

.badge-yes {
    color: #74e6a7;
    background: rgba(54,211,124,.07);
    border: 1px solid rgba(54,211,124,.15);
}

.badge-no {
    color: #7d8794;
    background: #0e141b;
    border: 1px solid #202833;
}

/* =========================
   DROPDOWN
========================= */

.dropdown-cell {
    position: relative;
    display: inline-block;

    max-width: 100%;
}

.dropdown-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;

    width: 100%;
    min-width: 76px;

    padding: 5px 7px;

    border: 1px solid #27313d;
    background: #10161e;

    border-radius: 5px;

    color: #9ec7e5;

    font-size: 9px;
    font-weight: 650;

    cursor: default;

    transition:
        background .15s ease,
        border .15s ease;
}

.dropdown-cell:hover .dropdown-btn {
    background: #151d27;
    border-color: #344252;
}

.dropdown-arrow {
    color: #657384;
    font-size: 7px;
}

/* =========================
   DROPDOWN MENU
========================= */

.dropdown-menu {
    position: absolute;

    left: 0;
    top: calc(100% + 5px);

    z-index: 9999;

    width: 185px;
    max-height: 220px;

    overflow-y: auto;

    padding: 5px;

    background: #10161e;

    border: 1px solid #2a3440;
    border-radius: 6px;

    box-shadow: 0 12px 30px rgba(0,0,0,.55);

    visibility: hidden;
    opacity: 0;

    pointer-events: none;

    transform: translateY(-4px);

    transition:
        opacity .14s ease,
        transform .14s ease,
        visibility .14s ease;
}

/*
    Khi rê chuột:
    mở menu
*/

.dropdown-cell:hover .dropdown-menu {
    visibility: visible;
    opacity: 1;

    pointer-events: auto;

    transform: translateY(0);
}

/*
    Cầu nối 5px giữa button và menu
*/

.dropdown-menu::before {
    content: "";

    position: absolute;

    left: 0;
    top: -7px;

    width: 100%;
    height: 7px;
}

.dropdown-item {
    padding: 7px 8px;

    color: #c4ccd6;

    font-size: 10px;

    border-bottom: 1px solid #1b222c;

    border-radius: 4px;
}

.dropdown-item:last-child {
    border-bottom: 0;
}

.dropdown-item:hover {
    background: #151d26;
    color: #e4edf5;
}

/* =========================
   EMPTY / ERROR
========================= */

.empty {
    height: 100px;

    text-align: center;

    color: #687384 !important;

    font-size: 12px !important;
}

/* =========================
   BOTTOM COUNTER
========================= */

.counter {
    position: fixed;

    right: 16px;
    bottom: 15px;

    z-index: 10000;

    display: flex;
    align-items: center;
    gap: 6px;

    padding: 5px;

    background: rgba(10,14,20,.94);

    border: 1px solid #252d37;
    border-radius: 7px;

    box-shadow: 0 8px 25px rgba(0,0,0,.4);

    backdrop-filter: blur(8px);
}

.counter-box {
    display: flex;
    align-items: center;
    gap: 5px;

    padding: 5px 8px;

    border-radius: 5px;

    font-size: 9px;
    font-weight: 700;
}

.counter-online {
    color: #7de2a8;
    background: rgba(54,211,124,.07);
}

.counter-offline {
    color: #ef8a90;
    background: rgba(239,95,103,.07);
}

.counter-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;
}

.green-dot {
    background: var(--green);
}

.red-dot {
    background: var(--red);
}

/* =========================
   SCROLLBAR
========================= */

.table-container::-webkit-scrollbar {
    height: 7px;
}

.table-container::-webkit-scrollbar-track {
    background: #0a0e14;
}

.table-container::-webkit-scrollbar-thumb {
    background: #293341;
    border-radius: 20px;
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: #374354;
}

.dropdown-menu::-webkit-scrollbar {
    width: 5px;
}

.dropdown-menu::-webkit-scrollbar-thumb {
    background: #364150;
    border-radius: 20px;
}

/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 800px) {

    body {
        padding: 18px 8px 65px;
    }

    .header-top {
        align-items: flex-start;
    }

    .title-wrap h1 {
        font-size: 18px;
    }

    .live-indicator {
        font-size: 9px;
    }

    table {
        min-width: 1250px;
    }

    th {
        font-size: 8px;
    }

    td {
        font-size: 10px;
    }

    .counter {
        right: 8px;
        bottom: 8px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="header-top">

        <div class="title-wrap">

            <h1>
                Blox Fruits Account Checker
            </h1>

            <p>
                Live account database
            </p>

        </div>

        <div class="live-indicator">

            <span class="live-dot"></span>

            LIVE

        </div>

    </div>

</div>


<!-- =========================
     TABLE
========================= -->

<div class="table-container">

<table>

<thead>

<tr>

<th>Tên</th>
<th>Level</th>
<th>Beli</th>
<th>Fragment</th>
<th>Tộc</th>
<th>Melee</th>
<th>Fruit</th>
<th>Sword</th>
<th>Gun</th>
<th>Fruit Đồ</th>
<th>Haki Màu</th>
<th>Valk</th>
<th>Mirror</th>

</tr>

</thead>

<tbody id="accTableBody">

<tr>

<td
    colspan="13"
    class="empty"
>

    Đang tải dữ liệu...

</td>

</tr>

</tbody>

</table>

</div>


<!-- =========================
     ONLINE / OFFLINE COUNTER
========================= -->

<div class="counter">

    <div class="counter-box counter-online">

        <span class="counter-dot green-dot"></span>

        Online:
        <span id="onlineCount">0</span>

    </div>

    <div class="counter-box counter-offline">

        <span class="counter-dot red-dot"></span>

        Offline:
        <span id="offlineCount">0</span>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const FIREBASE_URL =
    "https://blox-tracker-default-rtdb.firebaseio.com";

const ACCOUNTS_URL =
    FIREBASE_URL + "/accounts";

const STREAM_URL =
    ACCOUNTS_URL + ".json";


/* =====================================================
   ONLINE TIMEOUT

   Sau 5 phút không nhận được Firebase update
   => OFFLINE
===================================================== */

const OFFLINE_TIMEOUT =
    5 * 60 * 1000;


/* =====================================================
   ACCOUNT ACTIVITY

   accountActivity[accountKey] =
   thời điểm cuối cùng Firebase gửi update
===================================================== */

const accountActivity = {};


/* =====================================================
   CURRENT DATA
===================================================== */

let accountData = {};


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "0";
    }

    const num =
        Number(
            String(value)
                .replace(/,/g, "")
                .replace(/[^\d.-]/g, "")
        );

    if (Number.isNaN(num)) {
        return escapeHTML(value);
    }

    return num.toLocaleString("en-US");

}


/* =====================================================
   GET FIELD
===================================================== */

function getValue(
    acc,
    names,
    fallback = ""
) {

    for (const name of names) {

        if (
            acc[name] !== undefined &&
            acc[name] !== null &&
            acc[name] !== ""
        ) {

            return acc[name];

        }

    }

    return fallback;

}


/* =====================================================
   ARRAY FIELD
===================================================== */

function getArray(
    acc,
    names
) {

    for (const name of names) {

        const value = acc[name];

        if (Array.isArray(value)) {
            return value;
        }

        if (
            value &&
            typeof value === "object"
        ) {

            return Object.values(value);

        }

    }

    return [];

}


/* =====================================================
   YES / NO
===================================================== */

function badge(value) {

    const text =
        String(value ?? "")
            .toLowerCase()
            .trim();

    const yes =
        value === true ||
        text === "true" ||
        text === "yes" ||
        text === "có" ||
        text === "✔ có";

    return yes

        ? `
            <span class="badge badge-yes">
                ✔ Có
            </span>
          `

        : `
            <span class="badge badge-no">
                ✖ Không
            </span>
          `;

}


/* =====================================================
   DROPDOWN
===================================================== */

function dropdown(
    icon,
    title,
    array
) {

    if (
        !array ||
        array.length === 0
    ) {

        return `
            <span
                style="
                    color:#616c7b;
                    font-size:9px;
                "
            >
                Không có
            </span>
        `;

    }

    const items =
        array
            .map(item => `
                <div class="dropdown-item">
                    ${icon}
                    ${escapeHTML(item)}
                </div>
            `)
            .join("");


    return `

        <div class="dropdown-cell">

            <div class="dropdown-btn">

                <span>
                    ${icon}
                    ${title}
                    (${array.length})
                </span>

                <span class="dropdown-arrow">
                    ▼
                </span>

            </div>

            <div class="dropdown-menu">

                ${items}

            </div>

        </div>

    `;

}


/* =====================================================
   CHECK ONLINE
===================================================== */

function isOnline(accountKey) {

    const last =
        accountActivity[accountKey];

    if (!last) {
        return false;
    }

    return (
        Date.now() - last
        <= OFFLINE_TIMEOUT
    );

}


/* =====================================================
   MARK ACCOUNT ONLINE
===================================================== */

function markOnline(accountKey) {

    if (!accountKey) {
        return;
    }

    accountActivity[accountKey] =
        Date.now();

}


/* =====================================================
   UPDATE COUNTERS
===================================================== */

function updateCounters() {

    let online = 0;
    let offline = 0;


    for (
        const key in accountData
    ) {

        if (
            isOnline(key)
        ) {

            online++;

        } else {

            offline++;

        }

    }


    document.getElementById(
        "onlineCount"
    ).textContent = online;


    document.getElementById(
        "offlineCount"
    ).textContent = offline;

}


/* =====================================================
   BUILD TABLE
===================================================== */

function renderAccounts() {

    const tbody =
        document.getElementById(
            "accTableBody"
        );


    tbody.innerHTML = "";


    const keys =
        Object.keys(accountData);


    if (keys.length === 0) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="13"
                    class="empty"
                >
                    Chưa có tài khoản.
                </td>

            </tr>

        `;

        updateCounters();

        return;

    }


    for (
        const accountKey of keys
    ) {

        const acc =
            accountData[accountKey] || {};


        const online =
            isOnline(accountKey);


        /* =========================================
           USERNAME
        ========================================= */

        const username =
            getValue(
                acc,
                [
                    "username",
                    "Username",
                    "user",
                    "name",
                    "Name"
                ],
                accountKey
            );


        /* =========================================
           LEVEL
        ========================================= */

        const level =
            getValue(
                acc,
                [
                    "level",
                    "Level",
                    "lv",
                    "Lv"
                ],
                0
            );


        /* =========================================
           BELI
        ========================================= */

        const beli =
            getValue(
                acc,
                [
                    "beli",
                    "Beli",
                    "money",
                    "Money"
                ],
                0
            );


        /* =========================================
           FRAGMENTS
        ========================================= */

        const fragments =
            getValue(
                acc,
                [
                    "fragments",
                    "Fragments",
                    "fragment",
                    "Fragment"
                ],
                0
            );


        /* =========================================
           RACE
        ========================================= */

        const race =
            getValue(
                acc,
                [
                    "race",
                    "Race"
                ],
                "Unknown"
            );


        const raceVersion =
            getValue(
                acc,
                [
                    "raceVersion",
                    "RaceVersion",
                    "raceV",
                    "RaceV",
                    "raceStage",
                    "RaceStage",
                    "vRace"
                ],
                ""
            );


        const raceHTML = `

            <span class="race">

                🧬

                ${escapeHTML(race)}

                ${
                    raceVersion

                        ? `
                            <span
                                class="race-version"
                            >
                                ${escapeHTML(
                                    raceVersion
                                )}
                            </span>
                          `

                        : ""
                }

            </span>

        `;


        /* =========================================
           MELEE
        ========================================= */

        const melee =
            getValue(
                acc,
                [
                    "melee",
                    "Melee",
                    "fightingStyle",
                    "FightingStyle"
                ],
                "Không có"
            );


        /* =========================================
           CURRENT FRUIT
        ========================================= */

        const currentFruit =
            getValue(
                acc,
                [
                    "fruit",
                    "Fruit",
                    "currentFruit",
                    "CurrentFruit",
                    "devilFruit",
                    "DevilFruit"
                ],
                "Không có"
            );


        /* =========================================
           SWORD
        ========================================= */

        const sword =
            getValue(
                acc,
                [
                    "sword",
                    "Sword",
                    "currentSword",
                    "CurrentSword"
                ],
                "Không có"
            );


        /* =========================================
           GUN
        ========================================= */

        const gun =
            getValue(
                acc,
                [
                    "gun",
                    "Gun",
                    "currentGun",
                    "CurrentGun"
                ],
                "Không có"
            );


        /* =========================================
           FRUIT INVENTORY
        ========================================= */

        const fruits =
            getArray(
                acc,
                [
                    "fruits",
                    "Fruits",
                    "fruitInventory",
                    "FruitInventory",
                    "inventoryFruits",
                    "InventoryFruits"
                ]
            );


        /* =========================================
           HAKI
        ========================================= */

        const haki =
            getArray(
                acc,
                [
                    "hakiColors",
                    "HakiColors",
                    "haki",
                    "Haki",
                    "colors",
                    "Colors"
                ]
            );


        /* =========================================
           VALKYRIE
        ========================================= */

        const valkyrie =
            getValue(
                acc,
                [
                    "valkyrie",
                    "Valkyrie",
                    "valk",
                    "Valk"
                ],
                false
            );


        /* =========================================
           MIRROR
        ========================================= */

        const mirror =
            getValue(
                acc,
                [
                    "mirror",
                    "Mirror"
                ],
                false
            );


        /* =========================================
           ROW
        ========================================= */

        const row = `

            <tr>

                <td>

                    <div
                        class="username-wrap"
                    >

                        <span
                            class="
                                status-dot
                                ${
                                    online
                                    ? "status-online"
                                    : "status-offline"
                                }
                            "
                            title="
                                ${
                                    online
                                    ? "Online"
                                    : "Offline"
                                }
                            "
                        ></span>

                        <span
                            class="username"
                            title="${escapeHTML(
                                username
                            )}"
                        >
                            ${escapeHTML(
                                username
                            )}
                        </span>

                    </div>

                </td>


                <td>

                    <span class="level">

                        ${formatNumber(
                            level
                        )}

                    </span>

                </td>


                <td>

                    <span class="beli">

                        ${formatNumber(
                            beli
                        )}

                    </span>

                </td>


                <td>

                    <span class="fragment">

                        ${formatNumber(
                            fragments
                        )}

                    </span>

                </td>


                <td>
                    ${raceHTML}
                </td>


                <td>

                    <span
                        class="equipment"
                        title="${escapeHTML(
                            melee
                        )}"
                    >
                        ${escapeHTML(
                            melee
                        )}
                    </span>

                </td>


                <td>

                    <span
                        class="equipment"
                        title="${escapeHTML(
                            currentFruit
                        )}"
                    >
                        ${escapeHTML(
                            currentFruit
                        )}
                    </span>

                </td>


                <td>

                    <span
                        class="equipment"
                        title="${escapeHTML(
                            sword
                        )}"
                    >
                        ${escapeHTML(
                            sword
                        )}
                    </span>

                </td>


                <td>

                    <span
                        class="equipment"
                        title="${escapeHTML(
                            gun
                        )}"
                    >
                        ${escapeHTML(
                            gun
                        )}
                    </span>

                </td>


                <td>

                    ${dropdown(
                        "🍎",
                        "Fruit",
                        fruits
                    )}

                </td>


                <td>

                    ${dropdown(
                        "🎨",
                        "Haki",
                        haki
                    )}

                </td>


                <td>

                    ${badge(
                        valkyrie
                    )}

                </td>


                <td>

                    ${badge(
                        mirror
                    )}

                </td>

            </tr>

        `;


        tbody.insertAdjacentHTML(
            "beforeend",
            row
        );

    }


    updateCounters();

}


/* =====================================================
   NORMAL FETCH

   Dùng để lấy dữ liệu ban đầu
   và cập nhật bảng định kỳ.
===================================================== */

async function fetchAccounts() {

    try {

        const response =
            await fetch(
                ACCOUNTS_URL + ".json"
            );


        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }


        const data =
            await response.json();


        accountData =
            data || {};


        /*
            Nếu stream chưa có hoạt động nào,
            tạm coi các account hiện tại là vừa
            được thấy lần đầu.
        */

        for (
            const key in accountData
        ) {

            if (
                accountActivity[key] === undefined
            ) {

                markOnline(key);

            }

        }


        renderAccounts();

    }

    catch (error) {

        console.error(
            "Firebase fetch error:",
            error
        );

    }

}


/* =====================================================
   FIREBASE REALTIME STREAM

   Đây là phần quan trọng cho Online/Offline.

   Firebase sẽ gửi event mỗi khi dữ liệu
   trong /accounts thay đổi.
===================================================== */

function startFirebaseStream() {

    if (
        typeof EventSource === "undefined"
    ) {

        console.warn(
            "Browser không hỗ trợ EventSource."
        );

        return;

    }


    try {

        const stream =
            new EventSource(
                STREAM_URL
            );


        stream.onmessage =
            function(event) {

                try {

                    const payload =
                        JSON.parse(
                            event.data
                        );


                    /*
                        Firebase REST stream:
                        payload.path
                        payload.data
                    */

                    const path =
                        payload.path || "/";

                    const data =
                        payload.data;


                    /* ============================
                       ROOT UPDATE
                    ============================ */

                    if (
                        path === "/"
                    ) {

                        accountData =
                            data || {};


                        /*
                            Lần đầu stream gửi snapshot
                        */

                        for (
                            const key in accountData
                        ) {

                            markOnline(key);

                        }


                        renderAccounts();

                        return;

                    }


                    /* ============================
                       XÁC ĐỊNH ACCOUNT KEY
                    ============================ */

                    const cleanPath =
                        path
                            .replace(/^\/+/, "")
                            .split("/");


                    const accountKey =
                        cleanPath[0];


                    if (!accountKey) {
                        return;
                    }


                    /*
                        Có update trong account
                        => account vừa hoạt động
                    */

                    markOnline(
                        accountKey
                    );


                    /* ============================
                       UPDATE DATA LOCAL
                    ============================ */

                    if (
                        cleanPath.length === 1
                    ) {

                        /*
                            PUT /account
                        */

                        if (
                            data === null
                        ) {

                            delete accountData[
                                accountKey
                            ];

                            delete accountActivity[
                                accountKey
                            ];

                        } else {

                            accountData[
                                accountKey
                            ] = data;

                        }

                    } else {

                        /*
                            PUT /account/field
                        */

                        if (
                            !accountData[
                                accountKey
                            ] ||
                            typeof accountData[
                                accountKey
                            ] !== "object"
                        ) {

                            accountData[
                                accountKey
                            ] = {};

                        }


                        let target =
                            accountData[
                                accountKey
                            ];


                        for (
                            let i = 1;
                            i < cleanPath.length - 1;
                            i++
                        ) {

                            const key =
                                cleanPath[i];


                            if (
                                !target[key] ||
                                typeof target[key] !==
                                "object"
                            ) {

                                target[key] = {};

                            }


                            target =
                                target[key];

                        }


                        const finalKey =
                            cleanPath[
                                cleanPath.length - 1
                            ];


                        target[finalKey] =
                            data;

                    }


                    renderAccounts();

                }

                catch (err) {

                    console.error(
                        "Firebase stream parse error:",
                        err
                    );

                }

            };


        stream.onerror =
            function() {

                /*
                    EventSource tự reconnect.
                    Không đóng ở đây.
                */

                console.warn(
                    "Firebase realtime stream đang kết nối lại..."
                );

            };

    }

    catch (error) {

        console.error(
            "Không thể khởi tạo Firebase stream:",
            error
        );

    }

}


/* =====================================================
   CHECK OFFLINE ĐỊNH KỲ

   Mỗi 10 giây kiểm tra account nào
   đã quá 5 phút chưa có update.
===================================================== */

setInterval(
    function() {

        renderAccounts();

    },
    10000
);


/* =====================================================
   INITIAL LOAD
===================================================== */

fetchAccounts();


/* =====================================================
   START REALTIME
===================================================== */

startFirebaseStream();


/* =====================================================
   FALLBACK REFRESH

   Bảng vẫn refresh 5 giây/lần.
===================================================== */

setInterval(
    fetchAccounts,
    5000
);

</script>
